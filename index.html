<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歯科自費診療 請求書作成システム</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for TSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clinic: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#0d9488', // Premium Teal
              600: '#0f766e',
              700: '#115e59',
              800: '#134e4a',
              900: '#042f2e',
            },
            accent: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9', // Soft Sky Blue
              600: '#0284c7',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom print style and global resets -->
  <style type="text/css">
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }
    
    /* Chrome, Safari, Edge, Opera number inputs remove arrows */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Firefox number inputs remove arrows */
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Print Styles */
    @media print {
      /* Hide all UI elements except the invoice preview */
      .no-print {
        display: none !important;
      }
      
      body, html {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm;
        height: 297mm;
      }

      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }

      @page {
        size: A4 portrait;
        margin: 12mm 15mm 15mm 15mm;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div id="root">
    <!-- Loading placeholder while React compiles in-browser -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-4">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-clinic-500 mx-auto"></div>
        <p class="text-slate-500 font-medium">システム起動中...</p>
      </div>
    </div>
  </div>

  <!-- React Application Core Code -->
  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;

    // TypeScript Types
    interface TreatmentItem {
      id: string;
      name: string;
      unitPrice: number;
      quantity: number;
      note: string;
    }

    interface PatientInfo {
      name: string;
      patientId: string;
      invoiceDate: string;
      clinicName: string;
      clinicAddress: string;
      clinicPhone: string;
    }

    // Default Predefined Treatment Options for select
    const PRESETS = [
      { name: "セラミッククラウン", price: 100000 },
      { name: "ホワイトニング", price: 30000 },
      { name: "インプラント", price: 350000 },
      { name: "矯正治療", price: 800000 },
      { name: "メンテナンス", price: 5000 },
      { name: "その他", price: 0 }
    ];

    // Initial Default Data (山田 太郎)
    const getInitialDate = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const initialPatientInfo: PatientInfo = {
      name: "山田 太郎",
      patientId: "10001",
      invoiceDate: getInitialDate(),
      clinicName: "みなと歯科クリニック",
      clinicAddress: "東京都中央区晴海 1-2-3 晴海レジデンス 2F",
      clinicPhone: "03-1234-5678"
    };

    const initialItems: TreatmentItem[] = [
      { id: "1", name: "セラミッククラウン", unitPrice: 100000, quantity: 1, note: "右下奥歯" },
      { id: "2", name: "ホワイトニング", unitPrice: 30000, quantity: 1, note: "ホームホワイトニング" },
      { id: "3", name: "メンテナンス", unitPrice: 5000, quantity: 2, note: "定期健診・PMTC" }
    ];

    // Helper to format currency
    const formatYen = (amount: number) => {
      return `¥${amount.toLocaleString('ja-JP')}`;
    };

    // --- App Component ---
    function App() {
      // 1. States
      const [patientInfo, setPatientInfo] = useState<PatientInfo>(() => {
        const saved = localStorage.getItem('ydc_patient');
        return saved ? JSON.parse(saved) : initialPatientInfo;
      });

      const [items, setItems] = useState<TreatmentItem[]>(() => {
        const saved = localStorage.getItem('ydc_items');
        return saved ? JSON.parse(saved) : initialItems;
      });

      const [discount, setDiscount] = useState<number>(() => {
        const saved = localStorage.getItem('ydc_discount');
        return saved ? Number(saved) : 0;
      });

      const [adjustment, setAdjustment] = useState<number>(() => {
        const saved = localStorage.getItem('ydc_adjustment');
        return saved ? Number(saved) : 0;
      });

      const [taxRate, setTaxRate] = useState<number>(() => {
        const saved = localStorage.getItem('ydc_tax_rate');
        return saved ? Number(saved) : 10;
      });

      const [isTaxInclusive, setIsTaxInclusive] = useState<boolean>(() => {
        const saved = localStorage.getItem('ydc_tax_inc');
        return saved ? JSON.parse(saved) : false;
      });

      const [paidAmount, setPaidAmount] = useState<number>(() => {
        const saved = localStorage.getItem('ydc_paid');
        return saved ? Number(saved) : 0;
      });

      const [validationError, setValidationError] = useState<string | null>(null);

      // Save states on changes
      useEffect(() => {
        localStorage.setItem('ydc_patient', JSON.stringify(patientInfo));
      }, [patientInfo]);

      useEffect(() => {
        localStorage.setItem('ydc_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('ydc_discount', String(discount));
      }, [discount]);

      useEffect(() => {
        localStorage.setItem('ydc_adjustment', String(adjustment));
      }, [adjustment]);

      useEffect(() => {
        localStorage.setItem('ydc_tax_rate', String(taxRate));
      }, [taxRate]);

      useEffect(() => {
        localStorage.setItem('ydc_tax_inc', JSON.stringify(isTaxInclusive));
      }, [isTaxInclusive]);

      useEffect(() => {
        localStorage.setItem('ydc_paid', String(paidAmount));
      }, [paidAmount]);

      // Validation
      useEffect(() => {
        const emptyItems = items.some(item => !item.name.trim());
        const invalidPriceOrQty = items.some(item => item.unitPrice < 0 || item.quantity <= 0);
        
        if (!patientInfo.name.trim()) {
          setValidationError("患者氏名を入力してください。");
        } else if (emptyItems) {
          setValidationError("空の診療項目名があります。");
        } else if (invalidPriceOrQty) {
          setValidationError("単価は0以上、数量は1以上で入力してください。");
        } else if (discount < 0) {
          setValidationError("値引き額は0以上で入力してください。");
        } else if (taxRate < 0 || taxRate > 100) {
          setValidationError("税率は0%〜100%の間で入力してください。");
        } else if (paidAmount < 0) {
          setValidationError("支払済み金額は0以上で入力してください。");
        } else {
          setValidationError(null);
        }
      }, [patientInfo, items, discount, taxRate, paidAmount]);

      // 2. Calculations
      const subtotal = items.reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
      const taxBase = Math.max(0, subtotal - discount);

      let tax = 0;
      let totalAmount = 0;

      if (isTaxInclusive) {
        // 内税 (税込表示の場合: 内訳として消費税を表示)
        tax = Math.floor(taxBase * (taxRate / (100 + taxRate)));
        totalAmount = Math.max(0, taxBase + adjustment);
      } else {
        // 外税 (税抜表示の場合: 小計から値引きした額に外税をプラス)
        tax = Math.floor(taxBase * (taxRate / 100));
        totalAmount = Math.max(0, taxBase + tax + adjustment);
      }

      const unpaidAmount = Math.max(0, totalAmount - paidAmount);

      // 3. Handlers
      const handleAddItem = () => {
        const newItem: TreatmentItem = {
          id: Date.now().toString(),
          name: "その他",
          unitPrice: 0,
          quantity: 1,
          note: ""
        };
        setItems([...items, newItem]);
      };

      const handleRemoveItem = (id: string) => {
        if (items.length <= 1) {
          alert("診療項目は最低1つ必要です。");
          return;
        }
        setItems(items.filter(item => item.id !== id));
      };

      const handleUpdateItem = (id: string, updatedFields: Partial<TreatmentItem>) => {
        setItems(items.map(item => {
          if (item.id === id) {
            const updated = { ...item, ...updatedFields };
            // Auto preset fill if changing preset name
            if (updatedFields.name && updatedFields.name !== item.name) {
              const preset = PRESETS.find(p => p.name === updatedFields.name);
              if (preset && preset.name !== "その他") {
                updated.unitPrice = preset.price;
              }
            }
            return updated;
          }
          return item;
        }));
      };

      const handleReset = () => {
        if (confirm("入力データを初期値にリセットしますか？")) {
          setPatientInfo(initialPatientInfo);
          setItems(initialItems);
          setDiscount(0);
          setAdjustment(0);
          setTaxRate(10);
          setIsTaxInclusive(false);
          setPaidAmount(0);
        }
      };

      const handlePrint = () => {
        window.print();
      };

      return (
        <div class="flex flex-col min-h-screen">
          
          {/* Header */}
          <header class="bg-white border-b border-slate-200/80 shadow-sm sticky top-0 z-30 no-print">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-clinic-500 flex items-center justify-center text-white shadow-md shadow-clinic-100">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                  </svg>
                </div>
                <div>
                  <h1 class="text-lg font-bold text-slate-800 tracking-wide">自費診療請求書作成システム</h1>
                  <p class="text-xs text-slate-400 font-medium">Dental Self-Pay Invoice Creator</p>
                </div>
              </div>
              
              <div class="flex items-center space-x-3">
                <button
                  onClick={handleReset}
                  class="inline-flex items-center px-3.5 py-2 border border-slate-200 text-sm font-semibold rounded-xl text-slate-600 bg-white hover:bg-slate-50 active:bg-slate-100 transition-all shadow-sm gap-1.5"
                  title="データを初期状態にクリア"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-slate-500">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                  </svg>
                  リセット
                </button>
                <button
                  onClick={handlePrint}
                  disabled={!!validationError}
                  class="inline-flex items-center px-5 py-2 text-sm font-semibold rounded-xl text-white bg-clinic-500 hover:bg-clinic-600 active:bg-clinic-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md shadow-clinic-100 gap-1.5"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.617 0-1.11-.474-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-14.326 0C3.768 7.28 3 8.213 3 9.292v6.458c0 1.08.768 2.014 1.837 2.174h1.09m10.56-11.25V4.125c0-.621-.504-1.125-1.125-1.125H7.875c-.621 0-1.125.504-1.125 1.125v2.625m10.56 0V7.5H6.72V4.125" />
                  </svg>
                  印刷 / PDF保存
                </button>
              </div>
            </div>
          </header>

          {/* Validation Alert */}
          {validationError && (
            <div class="bg-rose-50 border-b border-rose-100 py-3 px-4 text-center text-sm font-semibold text-rose-700 flex items-center justify-center gap-1.5 no-print">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
              </svg>
              <span>入力内容に不備があります: {validationError}</span>
            </div>
          )}

          {/* Main Content Layout */}
          <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-8">
            
            {/* Left Column: Interactive Input Controls */}
            <div class="flex-1 space-y-6 no-print">
              
              {/* 1. Patient Form Card */}
              <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
                <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
                  <div class="w-6 h-6 rounded-lg bg-clinic-50 text-clinic-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                  </div>
                  <h2 class="text-base font-bold text-slate-800">患者情報 & 医院情報</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">患者氏名 <span class="text-rose-500">*</span></label>
                    <input
                      type="text"
                      value={patientInfo.name}
                      onChange={e => setPatientInfo({ ...patientInfo, name: e.target.value })}
                      placeholder="山田 太郎"
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">患者番号 (カルテ番号)</label>
                    <input
                      type="text"
                      value={patientInfo.patientId}
                      onChange={e => setPatientInfo({ ...patientInfo, patientId: e.target.value })}
                      placeholder="10001"
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">請求日 <span class="text-rose-500">*</span></label>
                    <input
                      type="date"
                      value={patientInfo.invoiceDate}
                      onChange={e => setPatientInfo({ ...patientInfo, invoiceDate: e.target.value })}
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">医院名</label>
                    <input
                      type="text"
                      value={patientInfo.clinicName}
                      onChange={e => setPatientInfo({ ...patientInfo, clinicName: e.target.value })}
                      placeholder="みなと歯科クリニック"
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">医院住所</label>
                    <input
                      type="text"
                      value={patientInfo.clinicAddress}
                      onChange={e => setPatientInfo({ ...patientInfo, clinicAddress: e.target.value })}
                      placeholder="住所を入力してください"
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">電話番号</label>
                    <input
                      type="text"
                      value={patientInfo.clinicPhone}
                      onChange={e => setPatientInfo({ ...patientInfo, clinicPhone: e.target.value })}
                      placeholder="03-1234-5678"
                      class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 bg-slate-50/50"
                    />
                  </div>
                </div>
              </div>

              {/* 2. Treatment Items Card */}
              <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-lg bg-clinic-50 text-clinic-600 flex items-center justify-center">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-3.75 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                      </svg>
                    </div>
                    <h2 class="text-base font-bold text-slate-800">自費診療項目</h2>
                  </div>
                  <button
                    onClick={handleAddItem}
                    class="inline-flex items-center px-3 py-1.5 text-xs font-bold rounded-lg text-clinic-600 bg-clinic-50 hover:bg-clinic-100 active:bg-clinic-200 transition-all gap-1"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    ＋項目を追加
                  </button>
                </div>

                <div class="space-y-4">
                  {items.map((item, index) => (
                    <div key={item.id} class="p-4 bg-slate-50/70 border border-slate-100 rounded-xl space-y-3 relative group">
                      
                      {/* Close button top right */}
                      <button
                        onClick={() => handleRemoveItem(item.id)}
                        class="absolute top-3 right-3 text-slate-400 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition-colors"
                        title="この項目を削除"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                      </button>

                      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pr-8">
                        
                        {/* Selector/Input Name */}
                        <div class="sm:col-span-6">
                          <label class="block text-xs font-semibold text-slate-500 mb-1">診療項目名 <span class="text-rose-500">*</span></label>
                          <div class="flex gap-2">
                            <select
                              value={PRESETS.some(p => p.name === item.name) ? item.name : "その他"}
                              onChange={e => handleUpdateItem(item.id, { name: e.target.value })}
                              class="w-1/2 px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500"
                            >
                              {PRESETS.map(preset => (
                                <option key={preset.name} value={preset.name}>{preset.name}</option>
                              ))}
                            </select>
                            <input
                              type="text"
                              value={item.name}
                              onChange={e => handleUpdateItem(item.id, { name: e.target.value })}
                              placeholder="治療内容を入力"
                              class="w-1/2 px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500"
                            />
                          </div>
                        </div>

                        {/* Unit Price */}
                        <div class="sm:col-span-4">
                          <label class="block text-xs font-semibold text-slate-500 mb-1">単価 (円) <span class="text-rose-500">*</span></label>
                          <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">¥</span>
                            <input
                              type="number"
                              value={item.unitPrice || ''}
                              onChange={e => handleUpdateItem(item.id, { unitPrice: Number(e.target.value) })}
                              placeholder="0"
                              min="0"
                              class="w-full pl-7 pr-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white text-right focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 font-semibold text-slate-700"
                            />
                          </div>
                        </div>

                        {/* Quantity */}
                        <div class="sm:col-span-2">
                          <label class="block text-xs font-semibold text-slate-500 mb-1">数量 <span class="text-rose-500">*</span></label>
                          <input
                            type="number"
                            value={item.quantity || ''}
                            onChange={e => handleUpdateItem(item.id, { quantity: Number(e.target.value) })}
                            placeholder="1"
                            min="1"
                            class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white text-center focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500 font-semibold text-slate-700"
                          />
                        </div>

                        {/* Note/Remarks */}
                        <div class="sm:col-span-8">
                          <label class="block text-xs font-semibold text-slate-500 mb-1">備考</label>
                          <input
                            type="text"
                            value={item.note}
                            onChange={e => handleUpdateItem(item.id, { note: e.target.value })}
                            placeholder="例: 上顎前歯、右奥歯など (請求書に表示)"
                            class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-clinic-500 focus:border-clinic-500"
                          />
                        </div>

                        {/* Item Total Amount */}
                        <div class="sm:col-span-4 flex flex-col justify-end text-right">
                          <span class="text-xs text-slate-400 font-semibold mb-1">金額</span>
                          <span class="text-base font-bold text-slate-700 py-1">{formatYen(item.unitPrice * item.quantity)}</span>
                        </div>

                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 3. Price Adjustments Card */}
              <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
                <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
                  <div class="w-6 h-6 rounded-lg bg-clinic-50 text-clinic-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182.775-.617 1.766-.75 2.72-.603m6.5 3.A9 9 0 1 1 3 12c0-2.39.63-4.688 1.837-6.72M12 3v3" />
                    </svg>
                  </div>
                  <h2 class="text-base font-bold text-slate-800">金額・支払設定</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  
                  {/* Tax Mode Toggles */}
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">消費税計算区分</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                      <button
                        type="button"
                        onClick={() => setIsTaxInclusive(false)}
                        class={`py-1.5 text-xs font-bold rounded-lg transition-all ${!isTaxInclusive ? 'bg-white text-clinic-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        税抜（外税）
                      </button>
                      <button
                        type="button"
                        onClick={() => setIsTaxInclusive(true)}
                        class={`py-1.5 text-xs font-bold rounded-lg transition-all ${isTaxInclusive ? 'bg-white text-clinic-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        税込（内税）
                      </button>
                    </div>
                  </div>

                  {/* Tax Rate */}
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">消費税率 (%)</label>
                    <div class="relative">
                      <input
                        type="number"
                        value={taxRate}
                        onChange={e => setTaxRate(Number(e.target.value))}
                        placeholder="10"
                        min="0"
                        max="100"
                        class="w-full pr-8 pl-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 bg-slate-50/50 font-semibold text-slate-700"
                      />
                      <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-semibold">%</span>
                    </div>
                  </div>

                  {/* Discount */}
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">値引き額</label>
                    <div class="relative">
                      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">¥</span>
                      <input
                        type="number"
                        value={discount || ''}
                        onChange={e => setDiscount(Number(e.target.value))}
                        placeholder="0"
                        min="0"
                        class="w-full pl-7 pr-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 bg-slate-50/50 text-right font-semibold text-slate-700"
                      />
                    </div>
                  </div>

                  {/* Adjustment */}
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">端数調整額 (+ / -)</label>
                    <div class="relative">
                      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">¥</span>
                      <input
                        type="number"
                        value={adjustment || ''}
                        onChange={e => setAdjustment(Number(e.target.value))}
                        placeholder="0"
                        class="w-full pl-7 pr-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 bg-slate-50/50 text-right font-semibold text-slate-700"
                      />
                    </div>
                  </div>

                  {/* Paid Amount */}
                  <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">支払済み金額 (本日領収額など)</label>
                    <div class="relative">
                      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold">¥</span>
                      <input
                        type="number"
                        value={paidAmount || ''}
                        onChange={e => setPaidAmount(Number(e.target.value))}
                        placeholder="0"
                        min="0"
                        class="w-full pl-8 pr-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-clinic-500 bg-teal-50/20 text-right font-bold text-slate-800 text-base"
                      />
                    </div>
                  </div>

                </div>
              </div>

            </div>

            {/* Right Column: Preview of the physical Invoice */}
            <div class="w-full lg:w-[480px] xl:w-[520px] shrink-0 print-area">
              
              {/* Desktop Sticky Container */}
              <div class="sticky top-20 bg-white rounded-2xl border border-slate-200/80 p-6 md:p-8 shadow-md flex flex-col justify-between print-container">
                
                {/* Print Title (Invisible on screen, visible only when printing to specify document type) */}
                <div class="hidden print:block text-right text-xs text-slate-400 font-medium mb-2">請求書控え / 患者様用</div>

                {/* Main Invoice Section */}
                <div class="space-y-6">
                  
                  {/* Header Component */}
                  <div class="flex flex-col md:flex-row justify-between items-start gap-4 pb-5 border-b-2 border-slate-100">
                    <div>
                      <h2 class="text-xl font-bold text-slate-800 tracking-wider">自費診療請求書</h2>
                      <div class="mt-2.5 space-y-1.5">
                        <div class="flex items-baseline gap-1">
                          <span class="text-base font-bold text-slate-800 border-b border-slate-800 pb-0.5">{patientInfo.name || "山田 太郎"}</span>
                          <span class="text-xs text-slate-500 font-semibold">様</span>
                        </div>
                        {patientInfo.patientId && (
                          <p class="text-xs text-slate-500 font-semibold">患者番号: {patientInfo.patientId}</p>
                        )}
                      </div>
                    </div>
                    
                    <div class="text-right space-y-1.5 self-stretch md:self-auto flex flex-col justify-between items-end">
                      <p class="text-xs text-slate-500 font-semibold">請求日: {patientInfo.invoiceDate ? patientInfo.invoiceDate.replace(/-/g, '/') : getInitialDate().replace(/-/g, '/')}</p>
                      
                      <div class="text-right mt-1">
                        <p class="text-sm font-bold text-slate-800">{patientInfo.clinicName || "みなと歯科クリニック"}</p>
                        <p class="text-[10px] text-slate-400 font-medium max-w-[200px] leading-relaxed whitespace-pre-wrap">{patientInfo.clinicAddress}</p>
                        {patientInfo.clinicPhone && (
                          <p class="text-[10px] text-slate-400 font-medium mt-0.5">TEL: {patientInfo.clinicPhone}</p>
                        )}
                      </div>
                      
                      {/* Register Seal Box (領収印) */}
                      <div class="w-14 h-14 border border-dashed border-slate-300 rounded-md flex items-center justify-center text-[9px] text-slate-400 mt-2">
                        領収印
                      </div>
                    </div>
                  </div>

                  {/* Message/Intro */}
                  <p class="text-xs text-slate-600 leading-relaxed">
                    毎度ありがとうございます。下記の通りご請求申し上げます。
                  </p>

                  {/* Treatment Items Table */}
                  <div class="overflow-hidden border border-slate-200 rounded-xl">
                    <table class="min-w-full divide-y divide-slate-200">
                      <thead class="bg-slate-50">
                        <tr>
                          <th class="px-3 py-2 text-left text-xs font-bold text-slate-500 tracking-wider">診療内容</th>
                          <th class="px-2 py-2 text-center text-xs font-bold text-slate-500 tracking-wider">数量</th>
                          <th class="px-3 py-2 text-right text-xs font-bold text-slate-500 tracking-wider">単価</th>
                          <th class="px-3 py-2 text-right text-xs font-bold text-slate-500 tracking-wider">金額</th>
                        </tr>
                      </thead>
                      <tbody class="bg-white divide-y divide-slate-100">
                        {items.map((item) => (
                          <tr key={item.id}>
                            <td class="px-3 py-2.5">
                              <p class="text-xs font-bold text-slate-800">{item.name}</p>
                              {item.note && <p class="text-[10px] text-slate-400 mt-0.5">{item.note}</p>}
                            </td>
                            <td class="px-2 py-2.5 text-center text-xs text-slate-600 font-semibold">{item.quantity}</td>
                            <td class="px-3 py-2.5 text-right text-xs text-slate-600 font-semibold">{formatYen(item.unitPrice)}</td>
                            <td class="px-3 py-2.5 text-right text-xs text-slate-800 font-bold">{formatYen(item.unitPrice * item.quantity)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Summary Block */}
                  <div class="space-y-2 border-t border-slate-100 pt-4">
                    <div class="flex justify-between items-center text-xs text-slate-500 font-medium">
                      <span>小計</span>
                      <span class="font-semibold text-slate-700">{formatYen(subtotal)}</span>
                    </div>

                    {discount > 0 && (
                      <div class="flex justify-between items-center text-xs text-slate-500 font-medium">
                        <span>値引き</span>
                        <span class="font-semibold text-emerald-600">-{formatYen(discount)}</span>
                      </div>
                    )}

                    <div class="flex justify-between items-center text-xs text-slate-500 font-medium">
                      <span>消費税 ({taxRate}% {isTaxInclusive ? '内税' : '外税'})</span>
                      <span class="font-semibold text-slate-700">
                        {isTaxInclusive ? `(${formatYen(tax)})` : formatYen(tax)}
                      </span>
                    </div>

                    {adjustment !== 0 && (
                      <div class="flex justify-between items-center text-xs text-slate-500 font-medium">
                        <span>端数調整額</span>
                        <span class={`font-semibold ${adjustment > 0 ? 'text-slate-700' : 'text-emerald-600'}`}>
                          {adjustment > 0 ? '+' : ''}{formatYen(adjustment)}
                        </span>
                      </div>
                    )}

                    {/* Total Amount (Highlight 1) */}
                    <div class="flex justify-between items-center bg-slate-50 px-3.5 py-3 rounded-xl border border-slate-100 mt-2">
                      <span class="text-sm font-bold text-slate-600">請求合計金額（税込）</span>
                      <span class="text-lg font-black text-slate-800 tracking-wide">{formatYen(totalAmount)}</span>
                    </div>

                    {paidAmount > 0 && (
                      <div class="flex justify-between items-center text-xs text-slate-500 font-medium px-1 mt-2">
                        <span>支払済み金額</span>
                        <span class="font-semibold text-slate-700">{formatYen(paidAmount)}</span>
                      </div>
                    )}

                    {/* Remaining Unpaid Amount (Highlight 2) */}
                    <div class="flex justify-between items-center bg-clinic-50 border border-clinic-100 px-3.5 py-3.5 rounded-xl mt-3">
                      <div class="flex flex-col">
                        <span class="text-xs font-bold text-clinic-700">今回ご請求金額</span>
                        <span class="text-[9px] text-clinic-500 font-medium mt-0.5">(合計金額 - 既収金)</span>
                      </div>
                      <span class="text-xl font-extrabold text-clinic-700 tracking-wide">{formatYen(unpaidAmount)}</span>
                    </div>

                  </div>

                </div>

                {/* Footer notes */}
                <div class="mt-8 pt-4 border-t border-slate-100 text-[10px] text-slate-400 space-y-1">
                  <p class="font-medium text-slate-500">【備考】</p>
                  <p class="leading-relaxed">
                    ・本請求書は自費診療（保険外診療）に関する請求書です。保険診療の領収書とは別扱いとなります。
                  </p>
                  <p class="leading-relaxed">
                    ・ご不明な点がございましたら、当院受付窓口までお気軽にお問い合わせください。
                  </p>
                </div>

              </div>
            </div>

          </main>
          
          {/* Web Footer */}
          <footer class="bg-white border-t border-slate-200/60 py-4 text-center text-xs text-slate-400 font-medium no-print mt-8">
            <p>&copy; 2026 みなと歯科クリニック - 自費診療請求書作成システム</p>
          </footer>

        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
